services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARVIN_HOST: 0.0.0.0
      MARVIN_PORT: 8787
      MARVIN_DATA_DIR: /data
      MARVIN_LICENSES_FILE: /data/licenses.json
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - marvin_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  marvin_data:
