name: MARVIN AI Studio CI
on:
  push:
    paths:
      - "ai-studio/**"
      - ".github/workflows/ai-studio.yml"
  pull_request:
    paths:
      - "ai-studio/**"
      - ".github/workflows/ai-studio.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check:server
      - run: npm test
      - run: npm run build
